name: 早间提醒

# 思路：GitHub 的定时任务会被延迟（实测 0-4 小时）。
# 所以提前 4 小时启动作业，进来后 sleep 到北京时间 07:30 再发 —— 延迟被 sleep 吸收，发送时刻就准了。
on:
  schedule:
    - cron: "30 19 * * *"   # 北京时间 03:30 启动，等 4 小时
    - cron: "0 22 * * *"    # 06:00 兜底：如果上面那次被丢了，这次补
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vocabcurve-morning
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 等到 07:30
        run: |
          TARGET=$(TZ=Asia/Shanghai date +%s -d "today 07:30")
          NOW=$(date +%s)
          WAIT=$((TARGET - NOW))
          if [ "$WAIT" -gt 0 ]; then
            echo "sleep ${WAIT}s"
            sleep "$WAIT"
          fi

      - name: 时间窗（07:00-10:00 之外就不发）
        id: window
        run: |
          H=$(TZ=Asia/Shanghai date +%H); H=$((10#$H))
          if [ "$H" -lt 7 ] || [ "$H" -ge 10 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 今天是否已经发过
        if: steps.window.outputs.skip == 'false'
        id: check
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ -f state/last-sent.txt ] && [ "$(cat state/last-sent.txt)" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 推送
        if: steps.window.outputs.skip == 'false' && steps.check.outputs.skip == 'false'
        env:
          PUSH_URL: ${{ secrets.VOCAB_PUSH_URL }}
        run: |
          python -m vocabcurve push --url "$PUSH_URL" --format wecom --title "今日单词复习"
          mkdir -p state && echo "${{ steps.check.outputs.today }}" > state/last-sent.txt

      - name: 记录
        if: steps.window.outputs.skip == 'false' && steps.check.outputs.skip == 'false'
        run: |
          git config user.name "vocabcurve-bot"
          git config user.email "vocabcurve@local"
          git add state/last-sent.txt
          git commit -m "chore: 早上已发 $(cat state/last-sent.txt)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
